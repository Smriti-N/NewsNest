  <text x="135" y="405" fill="#8896be" font-size="13">2 stories</text>

  <rect x="430" y="340" width="340" height="110" rx="12" fill="#171d36" stroke="#2b3658"/>
  <text x="455" y="380" fill="#7b93ff" font-size="22">🩺</text>
  <text x="495" y="380" fill="#ffffff" font-size="18" font-weight="bold">Health</text>
  <text x="495" y="405" fill="#8896be" font-size="13">3 stories</text>

  <rect x="790" y="340" width="340" height="110" rx="12" fill="#171d36" stroke="#2b3658"/>
  <text x="815" y="380" fill="#7b93ff" font-size="22">🔬</text>
  <text x="855" y="380" fill="#ffffff" font-size="18" font-weight="bold">Science</text>
  <text x="855" y="405" fill="#8896be" font-size="13">3 stories</text>

  <!-- Row 3 -->
  <rect x="70" y="470" width="340" height="110" rx="12" fill="#171d36" stroke="#2b3658"/>
  <text x="95" y="510" fill="#7b93ff" font-size="22">🎬</text>
  <text x="135" y="510" fill="#ffffff" font-size="18" font-weight="bold">Entertainment</text>
  <text x="135" y="535" fill="#8896be" font-size="13">2 stories</text>

  <rect x="430" y="470" width="340" height="110" rx="12" fill="#171d36" stroke="#2b3658"/>
  <text x="455" y="510" fill="#7b93ff" font-size="22">🌍</text>
  <text x="495" y="510" fill="#ffffff" font-size="18" font-weight="bold">World</text>
  <text x="495" y="535" fill="#8896be" font-size="13">4 stories</text>

  <rect x="790" y="470" width="340" height="110" rx="12" fill="#171d36" stroke="#2b3658"/>
  <text x="815" y="510" fill="#7b93ff" font-size="22">🇮🇳</text>
  <text x="855" y="510" fill="#ffffff" font-size="18" font-weight="bold">India</text>
  <text x="855" y="535" fill="#8896be" font-size="13">4 stories</text>

  <!-- Filter & Search Summary Bar below -->
  <rect x="70" y="605" width="1060" height="90" rx="12" fill="#121729" stroke="#252d4a"/>
  <text x="100" y="642" fill="#ffffff" font-size="16" font-weight="bold">Search &amp; Filter Capabilities</text>
  <text x="100" y="668" fill="#8896be" font-size="13">Filter articles by category, sort by "Latest" or "Popular" (view counts), and search instantly across titles &amp; 50-word summaries.</text>
