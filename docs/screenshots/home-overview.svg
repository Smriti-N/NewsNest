<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#0e1326; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f5bff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2640"/>
      <stop offset="100%" stop-color="#141a30"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Browser Chrome Header -->
  <rect width="1200" height="42" fill="#13182c"/>
  <circle cx="25" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="21" r="6" fill="#27c93f"/>
  <rect x="250" y="8" width="700" height="26" rx="6" fill="#1e2540"/>
  <text x="600" y="25" fill="#8896be" font-size="12" text-anchor="middle">http://localhost:5173 — NewsNest | The news in 50 words or fewer</text>

  <!-- App Header / Navbar -->
  <rect y="42" width="1200" height="70" fill="#171d36" stroke="#252c4a" stroke-width="1"/>
  <rect x="50" y="58" width="38" height="38" rx="10" fill="url(#brandGrad)"/>
  <text x="69" y="83" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">N</text>
  <text x="100" y="83" fill="#ffffff" font-size="22" font-weight="800">News<tspan fill="#7b93ff">Nest</tspan></text>

  <!-- Navigation items -->
  <text x="260" y="82" fill="#7b93ff" font-size="15" font-weight="bold">Home</text>
  <rect x="255" y="96" width="46" height="3" rx="1.5" fill="#7b93ff"/>
  <text x="340" y="82" fill="#9aa3c2" font-size="15">Categories</text>
  <text x="450" y="82" fill="#9aa3c2" font-size="15">Top News</text>
  <text x="550" y="82" fill="#9aa3c2" font-size="15">Saved</text>

  <!-- Search Input in Navbar -->
  <rect x="680" y="56" width="330" height="42" rx="10" fill="#0f1426" stroke="#2a3356" stroke-width="1"/>
  <text x="700" y="82" fill="#64729c" font-size="14">🔍 Search 50-word stories...</text>

  <!-- Write Story Button -->
  <rect x="1030" y="56" width="120" height="42" rx="10" fill="url(#brandGrad)" filter="url(#shadow)"/>
  <text x="1090" y="82" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">✍️ Write</text>

  <!-- Breaking Ticker -->
  <rect x="50" y="128" width="1100" height="38" rx="8" fill="#1d2440" stroke="#2a3458"/>
  <rect x="50" y="128" width="110" height="38" rx="8" fill="#e02424"/>
  <text x="105" y="152" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">⚡ TRENDING</text>
  <text x="175" y="152" fill="#cbd5e1" font-size="13">Metro line linking airport and old town opens • Nations agree on shared rules for ocean plastic • Farmers adopt phone-based weather alerts</text>

  <!-- Hero Featured Story Banner -->
  <rect x="50" y="180" width="720" height="280" rx="14" fill="url(#heroGrad)" stroke="#2b3658" stroke-width="1"/>
  <rect x="80" y="205" width="80" height="26" rx="6" fill="#2f5bff"/>
  <text x="120" y="222" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">INDIA</text>
  <text x="175" y="222" fill="#8896be" font-size="12">FEATURED STORY • 5 HOURS AGO</text>
  <text x="80" y="275" fill="#ffffff" font-size="26" font-weight="bold">Metro line linking airport and old town opens</text>
  <text x="80" y="315" fill="#cbd5e1" font-size="15" width="600">Riverton's long-awaited Metro line connecting the airport to the old town opened</text>
  <text x="80" y="340" fill="#cbd5e1" font-size="15">to commuters on Monday. Officials expect 80,000 daily riders, with trains every</text>
  <text x="80" y="365" fill="#cbd5e1" font-size="15">six minutes at peak hours. Tickets can be bought through a new mobile app.</text>
  <text x="80" y="420" fill="#7b93ff" font-size="14" font-weight="bold">Read full story (48 words) →</text>
  <text x="650" y="420" fill="#8896be" font-size="13">👁 8,420 views</text>

  <!-- Trending Sidebar List -->
  <rect x="790" y="180" width="360" height="280" rx="14" fill="#171d36" stroke="#2b3658" stroke-width="1"/>
  <text x="815" y="215" fill="#ffffff" font-size="18" font-weight="bold">🔥 Top Trending</text>
  <line x1="815" y1="230" x2="1125" y2="230" stroke="#283252" stroke-width="1"/>

  <text x="815" y="260" fill="#7b93ff" font-size="15" font-weight="bold">01</text>
  <text x="845" y="260" fill="#e2e8f0" font-size="14">Metro line linking airport opens</text>
  <text x="845" y="278" fill="#8896be" font-size="12">8,420 views • India</text>

  <text x="815" y="315" fill="#7b93ff" font-size="15" font-weight="bold">02</text>
  <text x="845" y="315" fill="#e2e8f0" font-size="14">AI startup open-sources weights</text>
  <text x="845" y="333" fill="#8896be" font-size="12">6,120 views • Technology</text>

  <text x="815" y="370" fill="#7b93ff" font-size="15" font-weight="bold">03</text>
  <text x="845" y="370" fill="#e2e8f0" font-size="14">Ocean plastic treaty finalized</text>
  <text x="845" y="388" fill="#8896be" font-size="12">5,430 views • World</text>

  <text x="815" y="425" fill="#7b93ff" font-size="15" font-weight="bold">04</text>
  <text x="845" y="425" fill="#e2e8f0" font-size="14">Pre-monsoon showers bring relief</text>
  <text x="845" y="443" fill="#8896be" font-size="12">3,980 views • India</text>

  <!-- Category Filter Pills -->
  <text x="50" y="495" fill="#ffffff" font-size="18" font-weight="bold">Latest Stories</text>
  <rect x="180" y="478" width="55" height="28" rx="14" fill="#2f5bff"/>
  <text x="207" y="497" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">All</text>
  <rect x="245" y="478" width="85" height="28" rx="14" fill="#1b223d" stroke="#2b3658"/>
  <text x="287" y="497" fill="#9aa3c2" font-size="13" text-anchor="middle">Technology</text>
  <rect x="340" y="478" width="75" height="28" rx="14" fill="#1b223d" stroke="#2b3658"/>
  <text x="377" y="497" fill="#9aa3c2" font-size="13" text-anchor="middle">Business</text>
  <rect x="425" y="478" width="65" height="28" rx="14" fill="#1b223d" stroke="#2b3658"/>
  <text x="457" y="497" fill="#9aa3c2" font-size="13" text-anchor="middle">India</text>
  <rect x="500" y="478" width="65" height="28" rx="14" fill="#1b223d" stroke="#2b3658"/>
  <text x="532" y="497" fill="#9aa3c2" font-size="13" text-anchor="middle">World</text>

  <!-- Story Grid Cards (3 Cards) -->
  <rect x="50" y="525" width="345" height="195" rx="12" fill="#171d36" stroke="#2a3354" stroke-width="1"/>
  <rect x="70" y="545" width="65" height="22" rx="4" fill="#23305a"/>
  <text x="102" y="560" fill="#7b93ff" font-size="11" font-weight="bold" text-anchor="middle">SCIENCE</text>
  <text x="70" y="595" fill="#ffffff" font-size="16" font-weight="bold">Deep sea observatory detects sounds</text>
  <text x="70" y="625" fill="#a0aec0" font-size="13">Sensors anchored three miles under water picked</text>
  <text x="70" y="645" fill="#a0aec0" font-size="13">up low frequency pulses near oceanic ridges.</text>
  <text x="70" y="690" fill="#718096" font-size="12">12 hours ago • 41 words</text>
  <text x="340" y="690" fill="#7b93ff" font-size="14">🔖</text>

  <rect x="425" y="525" width="345" height="195" rx="12" fill="#171d36" stroke="#2a3354" stroke-width="1"/>
  <rect x="445" y="545" width="85" height="22" rx="4" fill="#23305a"/>
  <text x="487" y="560" fill="#7b93ff" font-size="11" font-weight="bold" text-anchor="middle">TECHNOLOGY</text>
  <text x="445" y="595" fill="#ffffff" font-size="16" font-weight="bold">Battery startup doubles charge speeds</text>
  <text x="445" y="625" fill="#a0aec0" font-size="13">Engineers unveiled a silicon anode design that</text>
  <text x="445" y="645" fill="#a0aec0" font-size="13">reaches 80 percent charge inside eight minutes.</text>
  <text x="445" y="690" fill="#718096" font-size="12">16 hours ago • 44 words</text>
  <text x="715" y="690" fill="#7b93ff" font-size="14">🔖</text>

  <rect x="800" y="525" width="350" height="195" rx="12" fill="#171d36" stroke="#2a3354" stroke-width="1"/>
  <rect x="820" y="545" width="60" height="22" rx="4" fill="#23305a"/>
  <text x="850" y="560" fill="#7b93ff" font-size="11" font-weight="bold" text-anchor="middle">SPORTS</text>
  <text x="820" y="595" fill="#ffffff" font-size="16" font-weight="bold">National relay team breaks record</text>
  <text x="820" y="625" fill="#a0aec0" font-size="13">The mixed four by four hundred meter relay team</text>
  <text x="820" y="645" fill="#a0aec0" font-size="13">clocked three minutes twelve seconds at qualifiers.</text>
  <text x="820" y="690" fill="#718096" font-size="12">1 day ago • 39 words</text>
  <text x="1095" y="690" fill="#7b93ff" font-size="14">🔖</text>
</svg>